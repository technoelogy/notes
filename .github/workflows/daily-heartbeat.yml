name: Daily Heartbeat

on:
  schedule:
    - cron: '30 2 * * *'  # 02:30 UTC = 08:00 IST daily
  workflow_dispatch:       # lets you run it manually too

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Append today's date to heartbeat log
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" >> heartbeat.log

      - name: Commit and push
        run: |
          git config user.name "technoelogy"
          git config user.email "41233256+technoelogy@users.noreply.github.com"
          git add heartbeat.log
          git commit -m "heartbeat: $(date -u +%Y-%m-%d)" || exit 0
          git push
